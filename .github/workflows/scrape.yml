
name: Scrape and publish crypto dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crypto-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Test scraper
        run: npm test

      - name: Scrape public sources
        run: npm run scrape
        env:
          REQUEST_TIMEOUT_MS: "20000"
          STALE_AFTER_MINUTES: "15"
          STRICT_SOURCES: "false"

      - name: Prepare website data
        run: |
          mkdir -p site/data
          cp output/signals-latest.json site/data/signals.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
